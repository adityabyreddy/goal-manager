<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Goal Manager{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body { background: #f6f8fa; color: #24292f; }
      .gh-card { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; }
      .gh-header { background: #f6f8fa; border-bottom: 1px solid #d0d7de; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-light bg-white border-bottom">
      <div class="container py-1">
        <a class="navbar-brand fw-semibold" href="{{ request.url_for('dashboard') }}">Goal Manager</a>
      </div>
    </nav>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
