<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Goal Manager{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      html, body { height: 100%; }
      body { background: #f6f8fa; color: #24292f; display: flex; flex-direction: column; min-height: 100vh; }
      .gh-card { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; }
      .gh-header { background: #f6f8fa; border-bottom: 1px solid #d0d7de; }
      main.container { flex: 1 0 auto; }
      .gh-footer { flex-shrink: 0; background: #f6f8fa; border-top: 1px solid #d0d7de; color: #57606a; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-light bg-white border-bottom">
      <div class="container py-1">
        <a class="navbar-brand fw-semibold" href="{{ request.url_for('dashboard') }}">Goal Manager</a>
      </div>
    </nav>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
    <footer class="gh-footer text-center py-3 mt-auto">
      <div class="container">
        <small>Goal Management Platform &copy; 2026. All rights reserved.</small>
      </div>
    </footer>
  </body>
</html>
