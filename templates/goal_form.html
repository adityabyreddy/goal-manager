{% extends "base.html" %}
{% block title %}{% if goal %}Edit Goal{% else %}Create Goal{% endif %} · Goal Manager{% endblock %}
{% block content %}
<div class="gh-card">
  <div class="gh-header px-3 py-2 fw-semibold">
    {% if goal %}Edit{% else %}Create{% endif %} goal for {{ user.name }}
  </div>
  <div class="p-3">
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="{% if goal %}/ui/users/{{ user.id }}/goals/{{ goal.id }}/edit{% else %}/ui/users/{{ user.id }}/goals/new{% endif %}">
      <div class="mb-3">
        <label class="form-label" for="goal-title">Title</label>
        <input id="goal-title" class="form-control" name="title" required value="{{ goal.title if goal else '' }}" />
      </div>
      <div class="mb-3">
        <label class="form-label" for="goal-description">Description</label>
        <textarea id="goal-description" class="form-control" rows="3" name="description" required>{{ goal.description if goal else '' }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label" for="goal-labels">Labels (comma separated)</label>
        <input id="goal-labels" class="form-control" name="labels" value="{{ goal.labels|join(', ') if goal else '' }}" />
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label" for="goal-start-date">Start date</label>
          <input id="goal-start-date" class="form-control" type="date" name="start_date" required value="{{ goal.start_date if goal else '' }}" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="goal-end-date">End date</label>
          <input id="goal-end-date" class="form-control" type="date" name="end_date" required value="{{ goal.end_date if goal else '' }}" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="goal-priority">Priority</label>
          <select id="goal-priority" class="form-select" name="priority" required>
            {% set selected_priority = goal.priority if goal else 'medium' %}
            <option value="low" {% if selected_priority == "low" %}selected{% endif %}>Low</option>
            <option value="medium" {% if selected_priority == "medium" %}selected{% endif %}>Medium</option>
            <option value="high" {% if selected_priority == "high" %}selected{% endif %}>High</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">{% if goal %}Update{% else %}Create{% endif %} goal</button>
      <a href="/ui/dashboard" class="btn btn-link">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
